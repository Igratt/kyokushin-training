name: Android APK

# Builds the Kyokushin Android app (Capacitor wrapper around the Vite build) and publishes Kyokushin.apk
# under the fixed release tag "android", so this link always has the newest build:
# https://github.com/Igratt/kyokushin-training/releases/latest/download/Kyokushin.apk

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build the web app for the APK and sync it into the Android project
        run: npm run sync:android

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.p12"

      - name: Build the signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/app.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Kyokushin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kyokushin-apk
          path: Kyokushin.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Kyokushin Android
          body: Kyokushin Training Android programa. Atsisiųsk Kyokushin.apk telefone ir atidaryk failą.
          files: Kyokushin.apk
